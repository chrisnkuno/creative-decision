[project]
name = "cdm"
version = "0.2.0"
description = "Creative decision making: calibrated decision models + exact decision theory"
readme = "README.md"
authors = [
    { name = "chrisnkuno", email = "aimlnext@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.4",
]

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.1",
    "matplotlib>=3.11.2",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "scipy>=1.18.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PERF", "RUF", "N", "PL", "NPY", "PT", "RET", "ARG", "S", "FBT", "PTH"]
ignore = ["PLR0913", "PLR2004", "PLR0914", "PLR0915", "PLR0912", "N806", "N803", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "ARG", "S101", "FBT", "PLC2701"]
"demo.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "demo.py"]

[[tool.mypy.overrides]]
module = ["hypothesis.*"]
follow_imports = "normal"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real TypeSafe API (needs TYPESAFE_API_KEY)"]
addopts = "-m 'not live'"
